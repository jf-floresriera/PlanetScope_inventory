<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .t{fill:#0b0b0b;font-weight:700;font-size:15px}.s{fill:#52514e;font-size:12px}.g{fill:#52514e;font-size:11px}
    .barra1{animation:llena1 6s ease-in-out infinite}
    .barra2{animation:llena2 6s ease-in-out infinite}
    .barra3{animation:llena3 6s ease-in-out infinite}
    @keyframes llena1{0%{width:0}35%,100%{width:52px}}
    @keyframes llena2{0%,20%{width:0}60%,100%{width:507px}}
    @keyframes llena3{0%,40%{width:0}80%,100%{width:520px}}
    .aparece{opacity:0;animation:ap 6s ease-in-out infinite}
    @keyframes ap{0%,75%{opacity:0}85%,100%{opacity:1}}
  </style>
  <rect width="960" height="250" rx="18" fill="#f3f2ee"/>
  <text x="30" y="34" class="t">¿Cuántas escenas caben en 3.000 km² al mes? (plan E&amp;R Basic)</text>
  <text x="30" y="80" class="s">Escena completa (sin recorte) ≈ 640 km² c/u</text>
  <rect x="330" y="66" width="560" height="20" rx="6" fill="#e6e5e0"/><rect x="330" y="66" height="20" rx="6" fill="#eb6834" class="barra1"/>
  <text x="900" y="81" class="s" text-anchor="end">≈ 4 escenas</text>
  <text x="30" y="130" class="s">Recorte de 1 × 1 km → se cobran 100 km² c/u</text>
  <rect x="330" y="116" width="560" height="20" rx="6" fill="#e6e5e0"/><rect x="330" y="116" height="20" rx="6" fill="#c9c7c0" class="barra2"/>
  <text x="900" y="131" class="s" text-anchor="end">≈ 29 escenas · 99 % desperdiciado</text>
  <text x="30" y="180" class="s" font-weight="700">Recorte de ~10 × 10 km → 100 km² c/u ✓</text>
  <rect x="330" y="166" width="560" height="20" rx="6" fill="#e6e5e0"/><rect x="330" y="166" height="20" rx="6" fill="#2a78d6" class="barra3"/>
  <text x="900" y="181" class="s" text-anchor="end">≈ 29 escenas · área completa</text>
  <text x="30" y="225" class="g aparece">Regla de oro: un pedido por mes con el gestor · nunca pedir dos veces la misma escena · descargar lo ya pedido es gratis</text>
</svg>
